name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: re-download sources and rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Restore downloaded source data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Build data (pipeline)
        run: |
          uv sync --frozen
          # Scheduled runs re-download every source; pushes reuse the cache.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv run python -m pipeline.build --refresh
          else
            uv run python -m pipeline.build
          fi

      - name: Check published data (embargo, licenses, stories)
        run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (oceanradar.yasharma.com)
        id: deployment
        uses: actions/deploy-pages@v4
