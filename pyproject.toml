[project]
name = "ocean-radar"
version = "0.1.0"
description = "Static replay map of publicly tracked marine animals"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
